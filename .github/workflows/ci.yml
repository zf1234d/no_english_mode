name: CI

on:
  push:
    branches:
      - "**"
    paths:
      - "src/**"
      - "*.csproj"
      - "assets/**"
      - ".github/**"
      - "README.md"
  pull_request:
    paths:
      - "src/**"
      - "*.csproj"
      - "assets/**"
      - ".github/**"
      - "README.md"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path no_english_mode.csproj -Pattern '<Version>([^<]+)</Version>' | Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Output "release-version=${v}" >> $env:GITHUB_OUTPUT

      - name: Publish (Release)
        run: dotnet publish no_english_mode.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          $dist = 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item 'no_english_mode/bin/Release/net48/publish/no_english_mode.exe' $dist
          $version = "${{ steps.version.outputs.release-version }}"
          Compress-Archive -Path "$dist/*" -DestinationPath "no_english_mode-v$version.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: no_english_mode
          path: no_english_mode/bin/Release/net48/publish/no_english_mode.exe

      - name: Create Release
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore: bump version to ') }}"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.release-version }}
          name: v${{ steps.version.outputs.release-version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            no_english_mode-v${{ steps.version.outputs.release-version }}.zip
