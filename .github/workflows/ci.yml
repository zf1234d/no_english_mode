name: CI

on:
  push:
    branches:
      - "**"
    paths:
      - "src/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/**"
      - ".github/**"
  pull_request:
    paths:
      - "src/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/**"
      - ".github/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Read Version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Output "release-version=${v}" >> $env:GITHUB_OUTPUT

      - name: Build (Release)
        run: |
          $env:RUSTFLAGS = "-C opt-level=z -C lto=fat -C codegen-units=1 -C strip=symbols"
          cargo build --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: no_english_mode
          path: target/release/no_english_mode.exe

      - name: Create Release
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore: bump version to ') }}"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.release-version }}
          name: v${{ steps.version.outputs.release-version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            target/release/no_english_mode.exe
            assets/copy_to_startup.bat
            README.md
