name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  EXE_NAME: no_english_mode

jobs:
  build-and-release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Release
        run: |
          $env:RUSTFLAGS = "-C opt-level=z -C lto=fat -C codegen-units=1 -C strip=symbols"
          cargo build --release

      - name: Verify Binary
        run: |
          if (Test-Path "target/release/${{ env.EXE_NAME }}.exe") {
            Write-Host "Build OK: target/release/${{ env.EXE_NAME }}.exe"
          } else {
            Write-Error "Release binary not found"
            exit 1
          }

      - name: Get Tag Name
        id: tag
        shell: bash
        run: |
          if [ -n "$GITHUB_REF_NAME" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: ${{ steps.tag.outputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            target/release/${{ env.EXE_NAME }}.exe
            assets/copy_to_startup.bat
            README.md
